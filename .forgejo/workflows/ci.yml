name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Commit Convention ───────────────────────────────────────────────
  commitlint:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Validate all commits in PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git log --format="%H %s" origin/main..HEAD | while read hash msg; do
              echo "$hash $msg" | commitlint --from="$hash^" --to="$hash" || exit 1
            done
          else
            npx commitlint --from=HEAD~1 --to=HEAD 2>/dev/null || echo "Single commit push — commitlint skipped (no parent)"
          fi

  # ─── Lint (Biome) ────────────────────────────────────────────────────
  lint:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm ci --frozen-lockfile
      - name: Biome lint
        run: npx @biomejs/biome lint src/

  # ─── Type Check ──────────────────────────────────────────────────────
  typecheck:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm ci --frozen-lockfile
      - name: TypeScript check
        run: npx tsc --noEmit

  # ─── Test (Vitest) + Coverage gates ─────────────────────────────────
  test:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: covgate diffs changed lines against origin/main.
          fetch-depth: 0
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm ci --frozen-lockfile
      - name: Run tests with coverage (BLOCKING)
        # Tests MUST pass. Coverage reporters: json (Istanbul format, consumed
        # by covgate for the per-diff gate) + lcov (total-coverage floor below).
        run: npx vitest run --coverage --coverage.reporter=json --coverage.reporter=lcov --coverage.reporter=text
      - name: Check total coverage floor (30%)
        run: |
          node -e "
          const fs = require('fs');
          const t = fs.readFileSync('coverage/lcov.info', 'utf8');
          let lf = 0, lh = 0;
          for (const l of t.split('\n')) {
            if (l.startsWith('LF:')) lf += Number(l.slice(3));
            if (l.startsWith('LH:')) lh += Number(l.slice(3));
          }
          const pct = lf ? (lh / lf) * 100 : 0;
          console.log('Total line coverage: ' + pct.toFixed(1) + '% (' + lh + '/' + lf + ')');
          if (pct < 30) { console.error('Coverage below 30% floor'); process.exit(1); }
          console.log('Coverage floor met');
          "
      - name: Install covgate
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -fsSL https://github.com/jesse-black/covgate/releases/download/v0.2.0/covgate-v0.2.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/covgate.tar.gz
          echo "2b3e8aae7e26f584db9dec00cc70d27876dad929f3230fcd0a85f39e4a1f0e36 /tmp/covgate.tar.gz" | sha256sum -c
          tar xzf /tmp/covgate.tar.gz -C /tmp
          mv /tmp/covgate-v0.2.0-x86_64-unknown-linux-musl/covgate /usr/local/bin/covgate
          covgate --version
      - name: Per-diff coverage gate (covgate — BLOCKING)
        # Ratchet: lines CHANGED vs origin/main must meet the gates declared
        # in covgate.toml (repo root). On pushes to main the diff is empty
        # and this passes trivially.
        run: covgate check coverage/coverage-final.json --base origin/main
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/coverage-final.json

  # ─── Build ───────────────────────────────────────────────────────────
  build:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm ci --frozen-lockfile
      - name: Build
        run: npm run build

  # ─── Security (Gitleaks) ─────────────────────────────────────────────
  security:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
      - name: Gitleaks scan
        run: gitleaks detect --source . --no-banner
# Append these jobs under `jobs:` in any repo's ci.yml. Self-contained.
  supply-chain:
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install scanners
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl git ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner && chmod +x /usr/local/bin/osv-scanner
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/latest/download/trufflehog_linux_amd64.tar.gz | tar xz -C /usr/local/bin trufflehog
      - name: OSV dependency scan (hallucinated/vulnerable deps)
        run: osv-scanner scan source --format table ./ || echo "::warning::OSV findings — triaged baseline, see log"
      - name: Trufflehog verified-live secrets (all history)
        run: trufflehog git file://. --only-verified --failures-only --no-update

  nightly-deep-scan:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Noseyparker full-history secret hunt
        run: |
          curl -sSfL https://github.com/praetorian-inc/noseyparker/releases/latest/download/noseyparker-v0.24.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker scan --git-history-format all . || true
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker report || true
      - name: Grype vulnerability match on working tree
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype dir:. --fail-on critical || echo "::warning::critical vulns in tree"
