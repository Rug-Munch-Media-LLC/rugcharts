name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Commit Convention ───────────────────────────────────────────────
  commitlint:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Validate all commits in PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git log --format="%H %s" origin/main..HEAD | while read hash msg; do
              echo "$hash $msg" | commitlint --from="$hash^" --to="$hash" || exit 1
            done
          else
            npx commitlint --from=HEAD~1 --to=HEAD 2>/dev/null || echo "Single commit push — commitlint skipped (no parent)"
          fi

  # ─── Lint (Biome) ────────────────────────────────────────────────────
  lint:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm ci --frozen-lockfile
      - name: Biome lint
        run: npx @biomejs/biome lint src/

  # ─── Type Check ──────────────────────────────────────────────────────
  typecheck:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm ci --frozen-lockfile
      - name: TypeScript check
        run: npx tsc --noEmit

  # ─── Test (Vitest) + Coverage gates ─────────────────────────────────
  test:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: covgate diffs changed lines against origin/main.
          fetch-depth: 0
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm ci --frozen-lockfile
      - name: Run tests with coverage (BLOCKING)
        # Tests MUST pass. Coverage reporters: json (Istanbul format, consumed
        # by covgate for the per-diff gate) + lcov (total-coverage floor below).
        run: npx vitest run --coverage --coverage.reporter=json --coverage.reporter=lcov --coverage.reporter=text
      - name: Check total coverage floor (30%)
        run: |
          node -e "
          const fs = require('fs');
          const t = fs.readFileSync('coverage/lcov.info', 'utf8');
          let lf = 0, lh = 0;
          for (const l of t.split('\n')) {
            if (l.startsWith('LF:')) lf += Number(l.slice(3));
            if (l.startsWith('LH:')) lh += Number(l.slice(3));
          }
          const pct = lf ? (lh / lf) * 100 : 0;
          console.log('Total line coverage: ' + pct.toFixed(1) + '% (' + lh + '/' + lf + ')');
          if (pct < 30) { console.error('Coverage below 30% floor'); process.exit(1); }
          console.log('Coverage floor met');
          "
      - name: Install covgate
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -fsSL https://github.com/jesse-black/covgate/releases/download/v0.2.0/covgate-v0.2.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/covgate.tar.gz
          echo "2b3e8aae7e26f584db9dec00cc70d27876dad929f3230fcd0a85f39e4a1f0e36 /tmp/covgate.tar.gz" | sha256sum -c
          tar xzf /tmp/covgate.tar.gz -C /tmp
          mv /tmp/covgate-v0.2.0-x86_64-unknown-linux-musl/covgate /usr/local/bin/covgate
          covgate --version
      - name: Per-diff coverage gate (covgate — BLOCKING)
        # Ratchet: lines CHANGED vs origin/main must meet the gates declared
        # in covgate.toml (repo root). On pushes to main the diff is empty
        # and this passes trivially.
        run: covgate check coverage/coverage-final.json --base origin/main
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5.0.0
        with:
          name: coverage-report
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/coverage-final.json

  # ─── Backend (pytest + ruff) ─────────────────────────────────────────
  # Added 2026-08-25: backend tests existed but NEVER ran in CI — the test
  # job above only covered the frontend. 29 tests, ~2s runtime.
  backend:
    runs-on: docker-x64
    container:
      image: python:3.12-slim
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install dependencies
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest-cov
      - name: Ruff lint
        run: ruff check app tests
      - name: Run backend tests (BLOCKING)
        run: python -m pytest tests -q --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  # ─── SAST (semgrep + bandit) ─────────────────────────────────────────
  sast:
    runs-on: docker-x64
    container:
      image: python:3.12-slim
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install scanners
        run: pip install --no-cache-dir semgrep bandit
      - name: Semgrep scan (BLOCKING on ERROR)
        run: semgrep scan --config=auto --error --error-severity=ERROR app/
      - name: Bandit scan (BLOCKING on medium+)
        run: bandit -r app -x tests -ll

  # ─── Build ───────────────────────────────────────────────────────────
  build:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm ci --frozen-lockfile
      - name: Build
        run: npm run build

  # ─── Performance Smoke (k6) ──────────────────────────────────────────
  k6-smoke:
    # k6 needs a RUNNING backend to test against. In PR CI the full stack
    # (app + upstream data providers) would be required, and secrets are
    # not available in PR context. Runs on schedule against the live
    # deployment instead.
    # To enable: set K6_TARGET_URL as a repo variable (vars) or secret
    # pointing to the deployed API.
    #
    # Non-blocking (continue-on-error) until the API is available in CI.
    # Graduate to blocking by removing continue-on-error once a test
    # environment is provisioned.
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: docker-x64
    container:
      image: grafana/k6:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create results directory
        run: mkdir -p tests/k6/results
      - name: Connectivity pre-check
        run: |
          echo "🔍 Checking API reachability at ${{ vars.K6_TARGET_URL || 'https://charts.rugmunch.io' }} ..."
          curl -sSf -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ vars.K6_TARGET_URL || 'https://charts.rugmunch.io' }}/health" \
            --connect-timeout 10 --max-time 15 \
            && echo "✅ API is reachable — proceeding with k6 smoke test" \
            || echo "⚠️  API not reachable — k6 will report failures (non-blocking)"
        continue-on-error: true
      - name: Run k6 smoke test against live deployment
        run: |
          k6 run tests/k6/smoke.js \
            -e BASE_URL=${{ vars.K6_TARGET_URL || 'https://charts.rugmunch.io' }} \
            --summary-export=tests/k6/results/smoke-summary.json
      - uses: actions/upload-artifact@v5.0.0
        if: always()
        with:
          name: k6-smoke-report
          path: tests/k6/results/

  # ─── Security (Gitleaks) ─────────────────────────────────────────────
  security:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
      - name: Gitleaks scan
        run: gitleaks detect --source . --no-banner
# Append these jobs under `jobs:` in any repo's ci.yml. Self-contained.
  supply-chain:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install scanners
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl git ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner && chmod +x /usr/local/bin/osv-scanner
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.0/trufflehog_3.97.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin trufflehog
      - name: OSV dependency scan (hallucinated/vulnerable deps)
        run: osv-scanner scan source --format table ./ || echo "::warning::OSV findings — triaged baseline, see log"
      - name: Trufflehog verified-live secrets (all history)
        run: trufflehog git file://. --only-verified --fail --no-update

  nightly-deep-scan:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Noseyparker full-history secret hunt
        run: |
          curl -sSfL https://github.com/praetorian-inc/noseyparker/releases/latest/download/noseyparker-v0.24.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker scan --git-history-format all . || true
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker report || true
      - name: Grype vulnerability match on working tree
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype dir:. --fail-on critical || echo "::warning::critical vulns in tree"

  # ── Container scanning (trivy) ────────────────────────────────────
  trivy-scan:
    runs-on: docker-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trivy filesystem scan (BLOCKING on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # ── SBOM (CycloneDX) ─────────────────────────────────────────────
  sbom:
    runs-on: docker-x64
    needs: [backend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output: sbom.cyclonedx.json
      - uses: actions/upload-artifact@v5.0.0
        with:
          name: sbom
          path: sbom.cyclonedx.json

  # ── Keyless image signing (Cosign) ────────────────────────────────
  sign-image:
    runs-on: docker-x64
    needs: [backend]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.3'
      - name: Set up Docker BuildKit
        run: |
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
          echo "BUILDKIT_PROGRESS=plain" >> $GITHUB_ENV
      - name: Pull build cache
        run: docker pull registry.rugmunch.io/rugcharts:buildcache || echo "No cache image yet — building from scratch"
      - name: Build Docker image with cache
        run: |
          docker build \
            --cache-from registry.rugmunch.io/rugcharts:buildcache \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t registry.rugmunch.io/rugcharts:${{ github.sha }} \
            .
      - name: Push cache image
        run: |
          docker tag registry.rugmunch.io/rugcharts:${{ github.sha }} registry.rugmunch.io/rugcharts:buildcache
          docker push registry.rugmunch.io/rugcharts:buildcache
      - name: Push release image
        run: docker push registry.rugmunch.io/rugcharts:${{ github.sha }}
      - name: Sign image with keyless (OIDC)
        run: cosign sign --yes registry.rugmunch.io/rugcharts:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: "1"
      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity "https://git.rugmunch.io/RugMunchMedia/rugcharts/.forgejo/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://git.rugmunch.io" \
            registry.rugmunch.io/rugcharts:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: "1"

  # ── Dependency vulnerability audit (pip-audit) ─────────────────
  # Audits the DECLARED backend surface (backend/requirements.txt — pinned
  # ==versions) without installing the tree. Findings are triaged by the
  # maintainers and fixed via renovate bumps; do NOT silence with ignores.
  pip-audit:
    runs-on: docker-x64
    needs: [backend]
    container:
      image: python:3.12-slim
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pip-audit
        run: pip install --no-cache-dir pip-audit
      - name: Run pip-audit on declared deps (blocking on HIGH/CRITICAL)
        run: pip-audit -r requirements.txt --fail-on=high --desc

  # ── Dependency freshness (informational) ───────────────────────
  deps-freshness:
    runs-on: docker-x64
    needs: [backend]
    continue-on-error: true  # informational only for now
    container:
      image: python:3.12-slim
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check dependency freshness
        run: |
          pip install --no-cache-dir libyear 2>/dev/null || true
          libyear --file requirements.txt || echo "Dep freshness check noted (informational)"
